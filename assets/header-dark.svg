<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title">
  <title id="title">Dawid Szlachta. Frontend Developer: React and TypeScript, accessibility, design systems, AI-assisted engineering.</title>
  <style>
    .b1 { animation: d1 18s ease-in-out infinite alternate; }
    .b2 { animation: d2 23s ease-in-out infinite alternate; }
    .b3 { animation: d3 27s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(140px, 60px); } }
    @keyframes d2 { to { transform: translate(-160px, -50px); } }
    @keyframes d3 { to { transform: translate(90px, -70px); } }
    .tk { animation: float 5s ease-in-out infinite alternate; }
